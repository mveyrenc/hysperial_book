plugins:
  - rubocop-rails
  - rubocop-capybara
  - rubocop-factory_bot

AllCops:
  NewCops: enable
  Exclude:
    - bin/**/*
    - config/routes.rb
    - coverage/**/*
    - db/schema.rb
    - db/seeds_*
    - db/seeds/**/*
    - log/**/*
    - node_modules/**/*
    - public/**/*
    - tmp/**/*
    - vendor/**/*

Style/Documentation:
  Enabled: false
