services:
  db:
    image: postgres
    volumes:
      - hysperial_book_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=hysperial_book_development
      - PGDATA=/var/lib/postgresql/data
    ports:
      - "5432:5432"

  opensearch:
    image: opensearchproject/opensearch:latest
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true  # along with the memlock settings below, disables swapping
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m  # minimum and maximum Java heap size, recommend setting both to 50% of system RAM
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=hysp3rial_bOOk    # Sets the demo admin user password when using demo configuration, required for OpenSearch 2.12 and higher
      - DISABLE_INSTALL_DEMO_CONFIG=true # Prevents execution of bundled demo script which installs demo certificates and security configurations to OpenSearch
      - DISABLE_SECURITY_PLUGIN=true # Disables Security plugin
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536  # maximum number of open files for the OpenSearch user, set to at least 65536 on modern systems
        hard: 65536
    volumes:
      - hysperial_book_opensearch_data:/usr/share/opensearch/data
    ports:
      - 9200:9200
      - 9600:9600  # required for Performance Analyzer

  redis:
    image: "redis:alpine"
    environment:
      - REDIS_REPLICATION_MODE=master

  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ''
        RAILS_ENV: 'development'
    entrypoint: docker/entrypoints/rails.sh
    command: [ 'bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0' ]
    environment:
      - RAILS_ENV=development
      - APP_DATABASE_NAME=hysperial_book_development
      - APP_DATABASE_USERNAME=docker
      - APP_DATABASE_PASSWORD=docker
      - PG_URL=postgres://postgres:postgres@db
    volumes:
      - .:/usr/src/app
      - hysperial_book_yarn_cache:/root/.yarn-cache
    ports:
      - "3000:3000"
    links:
      - db
      - opensearch
      - redis
    stdin_open: true
    tty: true
    env_file:
      - .docker/web-variables.env

  selenium:
    image: selenium/standalone-chrome
    expose:
      - '4444'

